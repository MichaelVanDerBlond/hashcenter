<!DOCTYPE html>
<html lang="ru">

<head>

<meta charset="UTF-8">

<title>{{.Title}}</title>

<link rel="stylesheet" href="/static/style.css">

</head>

<body>

<h1>{{.Title}}</h1>

<div class="container">

{{template "uploads.html" .}}

{{template "favorites.html" .}}

{{template "dictionaries.html" .}}

{{template "jobs.html" .}}

</div>

<script>

async function refreshQueue(){

    const r=await fetch("/api/queue");

    if(!r.ok)
        return;

    const jobs=await r.json();

    const root=document.getElementById("queue");

    root.innerHTML="";

    if(jobs.length===0){

        root.innerHTML='<div class="job-card">Очередь пуста</div>';

        return;
    }

    for(const j of jobs){

        const card=document.createElement("div");

        card.className="job-card";

        card.innerHTML=
        "<div><b>ID:</b> "+j.id+"</div>"+
        "<div><b>Hash:</b> "+j.hash_file+"</div>"+
        "<div><b>Dictionary:</b> "+j.dictionary+"</div>"+
        "<div><b>Status:</b> "+j.state+"</div>"+
        "<div><b>Started:</b> "+(j.started??"")+"</div>"+
        "<div><b>Finished:</b> "+(j.finished??"")+"</div>";

        root.appendChild(card);

        root.appendChild(document.createElement("br"));
    }
}

async function startAttack(){

    const hash=document.querySelector('input[name="hashfile"]:checked');

    if(!hash){

        alert("Выберите файл");

        return;
    }

    const dicts=[];

    document.querySelectorAll(".dictionary:checked").forEach(e=>dicts.push(e.value));

    if(dicts.length===0){

        alert("Выберите словари");

        return;
    }

    const res=await fetch("/api/attack",{

        method:"POST",

        headers:{
            "Content-Type":"application/json"
        },

        body:JSON.stringify({

            hash_file:hash.value,

            dictionaries:dicts,

            hash_mode:22000,

            attack_mode:0,

            workload:3

        })

    });

    if(!res.ok){

        alert(await res.text());

        return;
    }

    refreshQueue();
}

document
.getElementById("startAttack")
.addEventListener("click",startAttack);

refreshQueue();

setInterval(refreshQueue,2000);

</script>

</body>

</html>
