<!doctype html>
<html lang="ru">

<head>

<meta charset="utf-8">

<title>{{ .title }}</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">

</head>

<body class="bg-dark">

<div class="container py-4">

<h2 class="text-light mb-4">

HashCenter R0.1

</h2>

<div class="card mb-4">

<div class="card-header">

Upload Hash Files

</div>

<div class="card-body">

<form
action="/upload"
method="post"
enctype="multipart/form-data">

<input
class="form-control mb-3"
type="file"
name="files"
multiple>

<button
class="btn btn-primary">

Upload

</button>

</form>

</div>

</div>

{{ template "favorites" . }}

{{ template "dictionaries" . }}

</div>

</body>

</html>
