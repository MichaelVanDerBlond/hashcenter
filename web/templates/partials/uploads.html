{{ define "uploads" }}

<div class="card mb-4">

    <div class="card-header">
        📂 Загруженные файлы
    </div>

    <div class="card-body p-0">

        <table class="table table-striped table-hover mb-0">

            <thead>
            <tr>
                <th width="40"></th>
                <th>Файл</th>
                <th width="120">Размер</th>
                <th width="120">Тип</th>
                <th width="180">Статус</th>
            </tr>
            </thead>

            <tbody>

            {{ range .Uploads }}

            <tr>
                <td>
                    <input type="checkbox" name="uploads" value="{{ .Name }}">
                </td>
                <td>{{ .Name }}</td>
                <td>{{ .Size }}</td>
                <td>{{ .Type }}</td>
                <td>{{ .Status }}</td>
            </tr>

            {{ else }}

            <tr>
                <td colspan="5" class="text-center text-muted">
                    Загруженных файлов нет
                </td>
            </tr>

            {{ end }}

            </tbody>

        </table>

    </div>

</div>

{{ end }}
